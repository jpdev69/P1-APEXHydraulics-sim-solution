[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apexhydraulics-sim"
version = "0.1.0"
description = "Apex Hydraulics network-design simulation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[project.scripts]
sim = "sim.cli:main"

[tool.setuptools]
packages = ["sim"]
